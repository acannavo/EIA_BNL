# ==========================================================================
#  Default parameters of the processing stages (values of the legacy scripts).
#  A run or a study may override them later.
# ==========================================================================

[peaks]                       # untitled28_EIA_Analysis_2
window_frac       = 0.02      # Gaussian window = t0 * (1 +/- (window_frac + corr))
corr_default      = 0.0
mu_bound_s        = 150e-9    # mu constrained to t0 +/- this
sigma_max_frac    = 0.1667    # sigma <= window width / 6
min_points        = 4         # fewer points in the window -> no fit (PSexp version; 2025 used 1)
u_step_frac       = 0.002     # GUI arrow step of U = p_value / 500 (untitled28 default)
lof_step_frac     = 0.01      # GUI arrow step of LOF = LOF / 100
max_u_clicks      = 30        # replay: search the U actually used within +/- this many clicks
                              # (2026 high U needed -12 .. -15)

# Masses typed in the untitled28 GUI (amu), keyed by the mass label written in Output
# (= int(typed mass)). Needed only to replay the legacy fits. 92 / 1 / 12 / 15 verified
# bit-exact on 20250611 and 2026_1103; 26 (Al) not yet verified (no Al raw SEM tested).
[peaks.gui_masses]
92 = 92.906
26 = 26.98
1  = 1.008
12 = 12.01
15 = 15.99
16 = 15.99

[calibration]                 # untitled27_REFACTORED_4
n_interp          = 100000    # common TOF grid of the EIA spectra
fc_grid_points    = 1000      # common grid of the FC traces (N7: coarse)
fc_source         = "start"   # FC traces used: "start" | "stop" | "both"
fc_baseline       = "legacy"  # FC pedestal: "legacy" (recovered from the legacy checkpoint, N7) | "pretrigger" | volts
fc_missing        = "error"   # no FC traces: "error" | "legacy_cfy" (take CFY_1m from the legacy checkpoint)
method            = "peak"    # "peak" (legacy, CFY = max FC / max sum EIA) | "area" (I2)
interp_fill       = "zero"    # "zero" (legacy) | "nan" (I4: mask outside the measured range)

[cbs]                         # cbs_manual_fitter_v12
gamma             = 1.6666666666666667   # 5/3
kT_min_eV         = 1.0
kT_max_eV         = 100.0
kT_guess_max_eV   = 1.0e4
kT_nscan          = 600
fit_win_hfac      = 3.0       # default window = t_peak +/- hfac * FWHM
noise_floor       = 1e-12
weight_floor_frac = 0.0
n_iter_sub        = 5
max_components    = 4
per_ion           = true      # fit J_z / z
recomb_dz         = [1, 2, 3]

[analysis]                    # plot_eia_powerLaw_test
zbar_min_frac     = 0.0
zbar_clip_negative = true     # np.clip(J, 0) (I5)
divide_by_z       = false     # Jacobian grids: charge (false) or ions (true) per energy (I7)

# ==========================================================================
#  Phase C corrections (Step 11). Each switch is recorded in the manifests of the stages
#  it affects, so flipping one marks exactly those stages stale. Every change of a
#  switch is documented in studies/<name>/changelog.md (eiakit snapshot / eiakit diff).
# ==========================================================================
[corrections]
# I1  mass unit and elementary charge of the CBS stage and of the analysis:
#     "legacy" = the per-run legacy profiles (proton mass as amu and Nb 92.206 in the
#     2025 CBS fits, e = 1.602e-19); "codata" = profile 'corrected' (CODATA 2018).
#     The stored CBS kT and V0 are rescaled by (M_new / M_old) (e_old / e_new): the CBS
#     shape in time, the FWHM and the areas do not change.
mass_constants = "legacy"
