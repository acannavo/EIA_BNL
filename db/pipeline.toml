# ==========================================================================
#  Default parameters of the processing stages (values of the legacy scripts).
#  A run or a study may override them later.
# ==========================================================================

[peaks]                       # untitled28_EIA_Analysis_2
window_frac       = 0.02      # Gaussian window = t0 * (1 +/- (window_frac + corr))
corr_default      = 0.0
mu_bound_s        = 150e-9    # mu constrained to t0 +/- this
sigma_max_frac    = 0.1667    # sigma <= window width / 6
min_points        = 4         # fewer points in the window -> no fit (PSexp version; 2025 used 1)
u_step_frac       = 0.002     # GUI arrow step of U = p_value / 500 (untitled28 default)
lof_step_frac     = 0.01      # GUI arrow step of LOF = LOF / 100
max_u_clicks      = 30        # replay: search the U actually used within +/- this many clicks
                              # (2026 high U needed -12 .. -15)

# Masses typed in the untitled28 GUI (amu), keyed by the mass label written in Output
# (= int(typed mass)). Needed only to replay the legacy fits. 92 / 1 / 12 / 15 verified
# bit-exact on 20250611 and 2026_1103; 26 (Al) not yet verified (no Al raw SEM tested).
# New runs (no [legacy] block in runs.toml): species of spectra_species -> mass label
# (the m column of the Output files) and highest z fitted (override per run: peaks_z_max)
[peaks.new_runs]
labels = { Nb = 92, Al = 26, H = 1, C = 12, O = 16 }
z_max  = { 92 = 22, 26 = 13, 1 = 1, 12 = 6, 16 = 8 }

[peaks.gui_masses]
92 = 92.906
26 = 26.98
1  = 1.008
12 = 12.01
15 = 15.99
16 = 15.99

[calibration]                 # untitled27_REFACTORED_4
n_interp          = 100000    # common TOF grid of the EIA spectra
fc_grid_points    = 1000      # common grid of the FC traces: 1000 (legacy, N7: 40 ns, peak -1 %) | "native" (scope sampling)
fc_peak           = "max"     # FC peak: "max" of the average (legacy) | "smoothed" (max after a moving average of fc_smooth_s)
fc_smooth_s       = 5.0e-8    # moving-average width for fc_peak = "smoothed" and the per-shot peaks
fc_peak_t_min_s   = 1.0e-6    # FC peak searched at t >= this (unset = whole trace, legacy): the laser pickup at t ~ 0 reaches 30 mV (20250611) and exceeds the ion peak in the 20250617 stop traces; all 2025 start peaks are at 6-16 us
fc_source         = "start"   # FC traces used: "start" | "stop" | "both"
fc_baseline       = "legacy"  # FC pedestal: "legacy" (recovered from the legacy checkpoint, N7) | "pretrigger" | "picked" (baseline tool, else legacy) | volts
fc_missing        = "error"   # no FC traces: "error" | "legacy_cfy" (CFY_1m of the legacy checkpoint) | "legacy_fc_peak" (FC peak of the legacy checkpoint: CFY follows changes of the EIA side)
method            = "peak"    # "peak" (legacy, CFY = max FC / max sum EIA) | "area" (I2)
interp_fill       = "zero"    # "zero" (legacy) | "nan" (I4: mask outside the measured range)
overlaps          = "nearest_line" # N8: "keep_both" (legacy: a peak fitted as two (m, z) counts twice) | "nearest_line" (each row on its nearest predicted line; one row per peak)
overlap_res_floor = 0.002         # N8: lines closer than this (relative TOF) are unresolvable
output_duplicates = "last_per_mz"   # N1: "all" (legacy: every appended save of p<U>.txt) | "last_per_mz" (newest fit of each charge state) | "last_save" (only the last save)

[cbs]                         # cbs_manual_fitter_v12
gamma             = 1.6666666666666667   # 5/3
kT_min_eV         = 1.0
kT_max_eV         = 100.0
kT_guess_max_eV   = 1.0e4
kT_nscan          = 600
fit_win_hfac      = 3.0       # default window = t_peak +/- hfac * FWHM
noise_floor       = 1e-12
weight_floor_frac = 0.0
n_iter_sub        = 5
max_components    = 4
per_ion           = true      # fit J_z / z
recomb_dz         = [1, 2, 3]

[analysis]                    # plot_eia_powerLaw_test
zbar_min_frac     = 0.0       # I5 noise floor: zbar valid where N_tot > zbar_min_frac x max N_tot (legacy 0)
zbar_clip_negative = true     # np.clip(J, 0) (I5)
zbar_mask         = "none"    # I4: "none" (legacy: zero fill outside each z's measured range) | "measured"
zbar_fill         = "zero"    # I4: "zero" (legacy) | "extrapolate" (power law through the 3 outer points of each z) | "edge" (flat at the edge value: extreme bound)
zbar_mask_tol     = 0.05      # I4: invalid where the ions possibly dropped outside the measured ranges exceed this fraction
# I3 / I7: the spectra figures show J_z (charge) vs t and u, and ions per energy (dN/dlnE next to
# dN/dE, J_z / z), with the units in the axis labels; the legacy DIVIDE_BY_Z switch is not needed.

# ==========================================================================
#  Phase C corrections (Step 11). Each switch is recorded in the manifests of the stages
#  it affects, so flipping one marks exactly those stages stale. Every change of a
#  switch is documented in studies/<name>/changelog.md (eiakit snapshot / eiakit diff).
# ==========================================================================
[corrections]
# I1  mass unit and elementary charge of the CBS stage and of the analysis:
#     "legacy" = the per-run legacy profiles (proton mass as amu and Nb 92.206 in the
#     2025 CBS fits, e = 1.602e-19); "codata" = profile 'corrected' (CODATA 2018).
#     The stored CBS kT and V0 are rescaled by (M_new / M_old) (e_old / e_new): the CBS
#     shape in time, the FWHM and the areas do not change.
mass_constants = "codata"

[report]
zbar_from_study = "PRL_AlNb"   # z-bar fit window (e_min/e_max per target, lower_from_z) of runs in no study
