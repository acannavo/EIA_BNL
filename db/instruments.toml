# ==========================================================================
#  Instrument configurations and acquisition (file-format) profiles.
#
#  A run refers to one EIA, one FC and one acquisition profile by name.
#  Values marked in `provisional` are assumptions to be confirmed: when the
#  real value is known, change it here and re-run the calibration stage and
#  everything downstream (the pipeline marks them stale).
# ==========================================================================

# ---- Energy Ion Analyzer (electrostatic analyzer + SEM) ------------------
#  E/q = U / ln(R_out/R_in)        (analyzer law, untitled28)
#  t   = L / sqrt(2 z e (E/q) / m)

[eia.EIA_2025]
description = "2025 campaign (Al, Nb), ns laser"
L_m         = 3.85            # flight path target -> SEM; untitled28: LOF = 3.86 - 0.01
R_out       = 102.5           # analyzer electrode radii (only the ratio matters)
R_in        = 97.5
R_orbit_m   = 0.1             # orbit radius used in untitled28 TOF() (cancels in E/q)
t0_s        = 0.0             # trigger / time-zero offset (unknown, not corrected; TODO s4)
provisional = ["t0_s"]

[eia.EIA_2026_ps]
description = "2026_1103 Nb run, ps laser, shorter flight path"
L_m         = 1.22
R_out       = 102.5
R_in        = 97.5
R_orbit_m   = 0.1
t0_s        = 0.0
provisional = ["t0_s"]

# ---- Faraday cup ---------------------------------------------------------

[fc.FC_2025]
description        = "2025 campaign"
L_m                = 2.38
aperture_radius_cm = 0.50
R_load_ohm         = 51.0
provisional        = []

[fc.FC_2026_ps]
description        = "2026_1103 Nb run. Aperture differs from 2025 but is not known yet: 0.50 cm assumed"
L_m                = 0.58
aperture_radius_cm = 0.50
R_load_ohm         = 51.0     # confirmed same as 2025
provisional        = ["aperture_radius_cm"]

# ---- Acquisition / file formats -------------------------------------------
#  How raw files are named and laid out. A run can override any field with
#      [runs."<key>".acquisition_overrides]
#      sem = { signal_column = "CH2", ignore = ["*bad*.csv"] }
#
#  patterns   file-name templates, first match wins (case-insensitive):
#               {int}{dec}  U = float("int.dec")   e.g. 000p6 -> 0.6, 12p25 -> 12.25
#               {U}         plain decimal number    e.g. 12.5
#               {rep}       repeat / shot number    (missing -> 1)
#               {*}         any text
#             or "re:<regex>" with named groups U / int / dec / rep
#  ignore     globs skipped before matching ("*first*.csv")
#  header     "skiprows:<n>"  or  "detect:<WORD>" (first line whose first field is WORD)
#  time_column / signal_column   column name, or 0-based index when there is no header line
#  time_scale / signal_scale     factors applied after reading (time -> seconds; -1 flips polarity)
#  u_scale    U [V] = value in the name x u_scale
#  Check what a format picks up in a run folder with:  eiakit files <run key>

[acquisition.scope_2025]
description = "2025 SEM exports <int>p<dec>v<rep>.csv (or <int>v<rep>.csv), FC exports *.csv"

[acquisition.scope_2025.sem]
folder        = "2_SEM"
patterns      = ["{int}p{dec}v{rep}.csv", "{int}v{rep}.csv"]
ignore        = []
header        = "skiprows:22"
time_column   = 0
signal_column = 1

[acquisition.scope_2025.fc]
folder        = "1_FC_Start"
folder_stop   = "3_FC_Stop"
patterns      = ["{*}.csv"]
header        = "skiprows:20"
time_column   = "TIME"
signal_column = "CH2"

[acquisition.scope_2026_mdo]
description = "2026 Tektronix MDO exports <NNN>p<D>Data<k>.csv; the ...first / ...second (shot) files are not used"

[acquisition.scope_2026_mdo.sem]
folder        = "2_SEM"
patterns      = ["{int}p{dec}Data{rep}.csv"]
ignore        = ["*first*.csv", "*second*.csv", "*.py"]
header        = "detect:TIME"
time_column   = "TIME"
signal_column = "CH3"

[acquisition.scope_2026_mdo.fc]
folder        = "1_FC_Start"
folder_stop   = "3_FC_Stop"
patterns      = ["{*}Data{rep}.csv"]
ignore        = ["*firstshot*.csv", "*secondshot*.csv"]     # single shots, not averaged by untitled27
header        = "skiprows:20"
time_column   = "TIME"
signal_column = "CH2"
