# ==========================================================================
#  Runs. The KEY of a run is the name of its folder in EIA_DATA_ROOT
#  (e.g. "20250623"); processed results use the same name.
#
#  include           false = known folder, not analysed (yet)
#  target            species of the target (species.toml)
#  label             short display label (figures, tables)
#  laser             what is known of the laser conditions; approximate = true
#                    marks order-of-magnitude values
#  eia / fc / acquisition   names in instruments.toml
#  acquisition_overrides     optional, changes single fields of the acquisition profile
#                    for this run only, e.g.
#                    acquisition_overrides = { sem = { signal_column = "CH2" } }
#  mass_labels       'm' labels of the target in the legacy peak files
#  spectra_species   species whose lines were picked in the SEM spectra (untitled28 mass list)
#  fit_file_labels   <label> of the legacy CBS files CBS_fit_results_<label>_<El>.txt, tried in order
#
#  [legacy]  how the legacy results of this run were made, so they can be rebuilt exactly
#    profile_peaks / profile_calibration / profile_cbs / profile_analysis
#                    constants profile (constants.toml) used by untitled28 / untitled27 /
#                    cbs_manual_fitter / plot scripts for this run
#    cbs_components  legacy CBS number -> physical component
#                    (fast, slow, ultra_fast, component_4); replaces the REMAP tables
#                    of the plot scripts (values taken from plot_cbs_multipanel_v2 and
#                    plot_collapse_v2, which agree)
# ==========================================================================

# ---------------------------------------------------------------- Al, 2025

[runs."20250513"]
include         = true
target          = "Al"
label           = "Al, 780 mJ"
date            = 2025-05-13
laser           = { energy_mJ = 780.0 }
eia             = "EIA_2025"
fc              = "FC_2025"
acquisition     = "scope_2025"
mass_labels     = [26]
spectra_species = ["Nb", "Al", "H", "C", "O"]
fit_file_labels = [27]
[runs."20250513".legacy]
profile_peaks       = "legacy_untitled28"
peaks_lof_m         = 3.8499999999999996   # LOF = 3.86 - 0.01 in untitled28 (2025)
peaks_grid          = "previous"           # N9 grid length rule of the 2025 script
profile_calibration = "legacy_proton"
profile_cbs         = "legacy_proton"
profile_analysis    = "legacy_amu_e1602"
cbs_components      = { 1 = "slow", 2 = "fast", 3 = "ultra_fast", 4 = "component_4" }

