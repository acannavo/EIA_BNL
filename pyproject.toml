[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eiakit"
version = "0.0.1"
description = "Energy Ion Analyzer (EIA) charge-state-distribution analysis of laser-produced plasmas"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "A. Cannavo" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "h5py>=3.10",
    "pydantic>=2.5",
    # < 6.8: newer Qt needs a newer msvcp140.dll than Anaconda ships, and the venv on the
    # analysis PC is built from Anaconda's Python (tools/diagnose_qt.py: 6.7.3 loads there)
    "PySide6>=6.6,<6.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "ipykernel"]

[project.scripts]
eiakit = "eiakit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
